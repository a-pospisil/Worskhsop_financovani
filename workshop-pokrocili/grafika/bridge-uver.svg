beration Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#B3BDB9" font-weight="normal" text-anchor="start">Nájmy</text><text x="850" y="564.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" font-weight="normal" text-anchor="start">nastavím smlouvy, 6–12 měs.</text><text x="850" y="590.25" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" font-weight="normal" text-anchor="start">chodí na účet nebo do DP</text><line x1="708" y1="608" x2="1212" y2="608" stroke="#12453A" stroke-width="1.5"/><text x="708" y="636" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#B3BDB9" font-weight="normal" text-anchor="start">Hodnota</text><text x="850" y="636.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" font-weight="normal" text-anchor="start">rekonstrukce / prohlášení</text><text x="850" y="662.25" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" font-weight="normal" text-anchor="start">vlastníka → vyšší ocenění</text><line x1="708" y1="680" x2="1212" y2="680" stroke="#12453A" stroke-width="1.5"/><text x="708" y="708" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#B3BDB9" font-weight="normal" text-anchor="start">Alternativa</text><text x="850" y="708.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" font-weight="normal" text-anchor="start">balon: kapitalizace</text><text x="850" y="734.25" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" font-weight="normal" text-anchor="start">úroků do jistiny</text><line x1="708" y1="752" x2="1212" y2="752" stroke="#12453A" stroke-width="1.5"/><path d="M1242,542.0 L1268,556.0 L1242,570.0 z" fill="#D9BE7F"/><rect x="1270" y="316" width="560" height="480" rx="16" fill="#0A2E24" stroke="#238A6C" stroke-width="3"/><text x="1298" y="364" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#238A6C" font-weight="bold" text-anchor="start" letter-spacing="2">EXIT: REFINANCOVÁNÍ DO BANKY</text><text x="1298" y="420" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#B3BDB9" font-weight="normal" text-anchor="start">Kam</text><text x="1440" y="420.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" font-weight="normal" text-anchor="start">nejčastěji Moneta,</text><text x="1440" y="446.25" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" font-weight="normal" text-anchor="start">Živnohypotéka až 30 let</text><line x1="1298" y1="464" x2="1802" y2="464" stroke="#12453A" stroke-width="1.5"/><text x="1298" y="492" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#B3BDB9" font-weight="normal" text-anchor="start">Sazba</text><text x="1440" y="492.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" font-weight="normal" text-anchor="start">o ~3 p. b. níž</text><text x="1440" y="518.25" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" font-weight="normal" text-anchor="start">než nebankovka</text><line x1="1298" y1="536" x2="1802" y2="536" stroke="#12453A" stroke-width="1.5"/><text x="1298" y="564" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#B3BDB9" font-weight="normal" text-anchor="start">Jistina</text><text x="1440" y="564.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" font-weight="normal" text-anchor="start">splatí ji banka,</text><text x="1440" y="590.25" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" font-weight="normal" text-anchor="start">nebankovka odchází</text><line x1="1298" y1="608" x2="1802" y2="608" stroke="#12453A" stroke-width="1.5"/><text x="1298" y="636" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#B3BDB9" font-weight="normal" text-anchor="start">Exit fee</text><text x="1440" y="636.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" font-weight="normal" text-anchor="start">do 1 roku 2–3 %, pak 0 %</text><text x="1440" y="662.25" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" font-weight="normal" text-anchor="start">(lze 0 % po 6 měsících)</text><line x1="1298" y1="680" x2="1802" y2="680" stroke="#12453A" stroke-width="1.5"/><text x="1298" y="708" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#B3BDB9" font-weight="normal" text-anchor="start">Alternativa</text><text x="1440" y="708.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" font-weight="normal" text-anchor="start">prodej po rozdělení</text><text x="1440" y="734.25" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" font-weight="normal" text-anchor="start">na jednotky</text><line x1="1298" y1="752" x2="1802" y2="752" stroke="#12453A" stroke-width="1.5"/><rect x="90" y="830" width="1150" height="170" rx="16" fill="#12453A"/><text x="118" y="876" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#D9BE7F" font-weight="bold" text-anchor="start" letter-spacing="2">CENA RYCHLOSTI · PŘÍKLAD 10 MIL. KČ NA 12 MĚSÍCŮ</text><text x="118" y="930" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="40" fill="#FFFFFF" font-weight="bold" text-anchor="start">950 000 Kč</text><text x="118" y="966" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#B3BDB9" font-weight="normal" text-anchor="start">úrok 9,5 % u nebankovky</text><text x="450" y="930" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="40" fill="#FFFFFF" font-weight="bold" text-anchor="start">+ 200 000 Kč</text><text x="450" y="966" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#B3BDB9" font-weight="normal" text-anchor="start">poplatek 2 %</text><text x="800" y="930" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="40" fill="#FFFFFF" font-weight="bold" text-anchor="start">+ 0–300 000 Kč</text><text x="800" y="966" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#B3BDB9" font-weight="normal" text-anchor="start">exit fee 0–3 %</text><rect x="1270" y="830" width="560" height="170" rx="16" fill="#0A2E24" stroke="#238A6C" stroke-width="3"/><text x="1298" y="876" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#238A6C" font-weight="bold" text-anchor="start" letter-spacing="2">VS. BANKA 6,5 %: 650 000 KČ</text><text x="1298" y="922.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" font-weight="normal" text-anchor="start">Rok u nebankovky stojí o 0,5–0,8 mil. Kč víc.</text><text x="1298" y="949.3" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" font-weight="normal" text-anchor="start">Vyplatí se, když rychlost rozhodne o koupi</text><text x="1298" y="976.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" font-weight="normal" text-anchor="start">nebo když banka zatím nájmy neuzná.</text><text x="90" y="1050" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#B3BDB9" font-weight="normal" text-anchor="start">Princip platí pro Credix, Fio i Home Credit – liší se sazby, LTV a poplatky (Home Credit splácí anuitně, balon nedělá). Ilustrativní čísla k 24. 9. 2026.</text></svg>