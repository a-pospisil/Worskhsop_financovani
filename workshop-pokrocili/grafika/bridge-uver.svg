rial, Helvetica, sans-serif" font-size="19" fill="#D9BE7F" font-weight="bold" text-anchor="start" letter-spacing="2">DEN 0 · ~10 PRACOVNÍCH DNŮ</text><circle cx="680" cy="262" r="26" fill="#D9BE7F" stroke="#06231C" stroke-width="5"/><text x="680" y="272" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" fill="#06231C" font-weight="bold" text-anchor="middle">2</text><text x="720" y="236" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#D9BE7F" font-weight="bold" text-anchor="start" letter-spacing="2">MĚSÍC 1–12 (MAX. 36)</text><circle cx="1270" cy="262" r="26" fill="#238A6C" stroke="#06231C" stroke-width="5"/><text x="1270" y="272" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" fill="#06231C" font-weight="bold" text-anchor="middle">3</text><text x="1310" y="236" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#238A6C" font-weight="bold" text-anchor="start" letter-spacing="2">EXIT · 6–12 MĚSÍCŮ PO NÁKUPU</text><rect x="90" y="316" width="560" height="480" rx="16" fill="#0A2E24" stroke="#D9BE7F" stroke-width="3"/><text x="118" y="364" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#D9BE7F" font-weight="bold" text-anchor="start" letter-spacing="2">NÁKUP PŘES NEBANKOVKU</text><text x="118" y="420" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#B3BDB9" font-weight="normal" text-anchor="start">Rychlost</text><text x="260" y="420.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" font-weight="normal" text-anchor="start">schválení i čerpání</text><text x="260" y="446.25" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" font-weight="normal" text-anchor="start">~10 pracovních dnů</text><line x1="118" y1="464" x2="622" y2="464" stroke="#12453A" stroke-width="1.5"/><text x="118" y="492" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#B3BDB9" font-weight="normal" text-anchor="start">LTV</text><text x="260" y="492.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" font-weight="normal" text-anchor="start">65–80 % podle typu</text><text x="260" y="518.25" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" font-weight="normal" text-anchor="start">a lokality</text><line x1="118" y1="536" x2="622" y2="536" stroke="#12453A" stroke-width="1.5"/><text x="118" y="564" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#B3BDB9" font-weight="normal" text-anchor="start">Vlastní zdroje</text><text x="260" y="564.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" font-weight="normal" text-anchor="start">min. 20 %</text><text x="260" y="590.25" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" font-weight="normal" text-anchor="start">(v rámci skupiny i 0 %)</text><line x1="118" y1="608" x2="622" y2="608" stroke="#12453A" stroke-width="1.5"/><text x="118" y="636" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#B3BDB9" font-weight="normal" text-anchor="start">Poplatek</text><text x="260" y="636.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" font-weight="normal" text-anchor="start">do 2 % z úvěrového</text><text x="260" y="662.25" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" font-weight="normal" text-anchor="start">rámce</text><line x1="118" y1="680" x2="622" y2="680" stroke="#12453A" stroke-width="1.5"/><text x="118" y="708" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#B3BDB9" font-weight="normal" text-anchor="start">Zástava</text><text x="260" y="708.0" font-family="Liberation Sans, Arial, Helvetica, sans-seri