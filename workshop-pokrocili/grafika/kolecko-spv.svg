lvetica, sans-serif" font-size="28" fill="#FFFFFF" font-weight="bold" text-anchor="middle">FO (investor)</text><text x="680.0" y="680.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#B3BDB9" font-weight="normal" text-anchor="middle">vlastník nemovitostí,</text><text x="680.0" y="707.3" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#B3BDB9" font-weight="normal" text-anchor="middle">dává zástavu</text><rect x="990" y="600" width="280" height="120" rx="14" fill="#0A2E24" stroke="#B6DCCB" stroke-width="3"/><text x="1130.0" y="644" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Koncový nájemník</text><text x="1130.0" y="680.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#B3BDB9" font-weight="normal" text-anchor="middle">třetí osoba</text><text x="1130.0" y="707.3" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#B3BDB9" font-weight="normal" text-anchor="middle">(ne ESSO)</text><line x1="990" y1="292" x2="846" y2="292" stroke="#D9BE7F" stroke-width="5" marker-end="url(#ah)"/><circle cx="918.0" cy="292.0" r="22" fill="#D9BE7F" stroke="#06231C" stroke-width="4"/><text x="918.0" y="301.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" fill="#06231C" font-weight="bold" text-anchor="middle">1</text><line x1="840" y1="330" x2="984" y2="330" stroke="#D9BE7F" stroke-width="5" marker-end="url(#ah)"/><circle cx="912.0" cy="330.0" r="22" fill="#D9BE7F" stroke="#06231C" stroke-width="4"/><text x="912.0" y="339.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" fill="#06231C" font-weight="bold" text-anchor="middle">8</text><line x1="370" y1="310" x2="514" y2="310" stroke="#B6DCCB" stroke-width="5" marker-end="url(#ahc)"/><circle cx="442.0" cy="310.0" r="22" fill="#B6DCCB" stroke="#06231C" stroke-width="4"/><tex