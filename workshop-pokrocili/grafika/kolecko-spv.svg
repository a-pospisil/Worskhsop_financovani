<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#06231C"/><defs><marker id="aw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="30" markerHeight="30" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D9BE7F"/></marker><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9BE7F"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B6DCCB"/></marker></defs><text x="90" y="100" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#D9BE7F" font-weight="bold" text-anchor="start" letter-spacing="4">POKROČILÁ STRATEGIE FINANCOVÁNÍ · 2</text><text x="90" y="162" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="54" fill="#FFFFFF" font-weight="bold" text-anchor="start">Úskalí kolečka a varianta SPV</text><rect x="90" y="230" width="520" height="560" rx="16" fill="#0A2E24" stroke="#E0951A" stroke-width="3"/><text x="122" y="286" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#E0951A" font-weight="bold" text-anchor="start" letter-spacing="3">PROBLÉM V ROZVAZE</text><text x="122" y="340.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF" font-weight="bold" text-anchor="start">Zápůjčka FO je ve výkazech</text><text x="122" y="375.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF" font-weight="bold" text-anchor="start">firmy jako pohledávka</text><text x="122" y="410.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF" font-weight="bold" text-anchor="start">za společníky.</text><text x="122" y="470.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" fill="#FFFFFF" font-weight="normal" text-anchor="start">ČSOB i další banky tento</text><text x="122" y="501.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" fill="#FFFFFF" font-weight="normal" text-anchor="start">závazek FO přičtou</text><text x="122" y="532.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" fill="#FFFFFF" font-weight="normal" text-anchor="start">do splátek → horší DSTI/DTI.</text><text x="122" y="610.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" fill="#B3BDB9" font-weight="normal" text-anchor="start">Přeúčtovat na „jiné pohledávky“</text><text x="122" y="641.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" fill="#B3BDB9" font-weight="normal" text-anchor="start">lze, ale banky řádek čím dál</text><text x="122" y="672.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" fill="#B3BDB9" font-weight="normal" text-anchor="start">častěji rozklíčují.</text><text x="122" y="750" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" fill="#D9BE7F" font-weight="bold" text-anchor="start">→ řešení: úvěr a zápůjčka v SPV</text><text x="660" y="260" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#D9BE7F" font-weight="bold" text-anchor="start" letter-spacing="3">VARIANTA MONETA: SPV</text><rect x="660" y="300" width="330" height="130" rx="14" fill="#0A2E24" stroke="#B6DCCB" stroke-width="3"/><text x="825.0" y="344" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Původní s.r.o.</text><text x="825.0" y="380.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#B3BDB9" font-weight="normal" text-anchor="middle">má bonitu</text><text x="825.0" y="407.3" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#B3BDB9" font-weight="normal" text-anchor="middle">→ ručí za úvěr SPV</text><rect x="1090" y="300" width="330" height="130" rx="14" fill="#12453A" stroke="#D9BE7F" stroke-width="3"/><text x="1255.0" y="344" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" fill="#FFFFFF" font-weight="bold" text-anchor="middle">SPV s.r.o.</text><text x="1255.0" y="380.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#B3BDB9" font-weight="normal" text-anchor="middle">dlužník, eviduje úvěr</text><text x="1255.0" y="407.3" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#B3BDB9" font-weight="normal" text-anchor="middle">i zápůjčku</text><rect x="1520" y="300" width="300" height="130" rx="14" fill="#0A2E24" stroke="#B6DCCB" stroke-width="3"/><text x="1670.0" y="344" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Moneta</text><text x="1670.0" y="380.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#B3BDB9" font-weight="normal" text-anchor="middle">SBL · zástava</text><text x="1670.0" y="407.3" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#B3BDB9" font-weight="normal" text-anchor="middle">nemovitosti FO</text><rect x="1090" y="560" width="330" height="130" rx="14" fill="#0A2E24" stroke="#238A6C" stroke-width="3"/><text x="1255.0" y="604" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" fill="#FFFFFF" font-weight="bold" text-anchor="middle">FO (investor)</text><text x="1255.0" y="640.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#B3BDB9" font-weight="normal" text-anchor="middle">vlastní nemovitosti,</text><text x="1255.0" y="667.3" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#B3BDB9" font-weight="normal" text-anchor="middle">dává zástavu</text><rect x="1520" y="560" width="300" height="130" rx="14" fill="#0A2E24" stroke="#B6DCCB" stroke-width="3"/><text x="1670.0" y="604" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Koncový nájemník</text><text x="1670.0" y="640.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#B3BDB9" font-weight="normal" text-anchor="middle">třetí osoba</text><text x="1670.0" y="667.3" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#B3BDB9" font-weight="normal" text-anchor="middle">(ne ESSO)</text><line x1="990" y1="365" x2="1084" y2="365" stroke="#B6DCCB" stroke-width="5" marker-end="url(#ahc)"/><text x="1040.0" y="338" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#B6DCCB" font-weight="bold" text-anchor="middle">ručení</text><line x1="1520" y1="365" x2="1426" y2="365" stroke="#B6DCCB" stroke-width="5" marker-end="url(#ahc)"/><text x="1470.0" y="338" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#B6DCCB" font-weight="bold" text-anchor="middle">úvěr</text><line x1="1200" y1="430" x2="1200" y2="554" stroke="#D9BE7F" stroke-width="5" marker-end="url(#ah)"/><text x="1186" y="500" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#D9BE7F" font-weight="bold" text-anchor="end">zápůjčka za tržní úrok</text><line x1="1310" y1="554" x2="1310" y2="436" stroke="#D9BE7F" stroke-width="5" marker-end="url(#ah)"/><text x="1326" y="500" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#D9BE7F" font-weight="bold" text-anchor="start">nájem</text><line x1="1420" y1="420" x2="1530" y2="556" stroke="#D9BE7F" stroke-width="5" marker-end="url(#ah)"/><text x="1510" y="470" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#D9BE7F" font-weight="bold" text-anchor="start">podnájem</text><line x1="1670" y1="554" x2="1670" y2="436" stroke="#B6DCCB" stroke-width="5" marker-end="url(#ahc)"/><text x="1686" y="500" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#B6DCCB" font-weight="bold" text-anchor="start">nájemné = obrat</text><text x="1686" y="526" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#B6DCCB" font-weight="bold" text-anchor="start">SPV od 3. osoby</text><rect x="660" y="740" width="380" height="160" rx="14" fill="#0A2E24" stroke="#D9BE7F" stroke-width="2"/><text x="686" y="786" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#D9BE7F" font-weight="bold" text-anchor="start" letter-spacing="3">OBRAT</text><text x="686" y="830.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#FFFFFF" font-weight="normal" text-anchor="start">≥ 2× měsíční splátka na BÚ SPV,</text><text x="686" y="858.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#FFFFFF" font-weight="normal" text-anchor="start">jen od třetích osob, ne od ESSO</text><rect x="1060" y="740" width="380" height="160" rx="14" fill="#0A2E24" stroke="#B6DCCB" stroke-width="2"/><text x="1086" y="786" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#B6DCCB" font-weight="bold" text-anchor="start" letter-spacing="3">VÝHLED</text><text x="1086" y="830.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#FFFFFF" font-weight="normal" text-anchor="start">depozitní účet 3–6 splátek</text><text x="1086" y="858.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#FFFFFF" font-weight="normal" text-anchor="start">→ pak stačí obrat 1× splátka</text><rect x="1460" y="740" width="380" height="160" rx="14" fill="#0A2E24" stroke="#238A6C" stroke-width="2"/><text x="1486" y="786" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#238A6C" font-weight="bold" text-anchor="start" letter-spacing="3">BONUS</text><text x="1486" y="830.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#FFFFFF" font-weight="normal" text-anchor="start">podnájem má nižší ochranu</text><text x="1486" y="858.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#FFFFFF" font-weight="normal" text-anchor="start">nájemníka než přímý nájem</text><text x="90" y="1010" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#B3BDB9" font-weight="normal" text-anchor="start">Moneta: zástava může být nemovitost třetí osoby · zápůjčka PO → FO vždy za tržní úrok · ilustrativní schéma, konkrétní strukturu ověřit s bankou a daňovým poradcem</text></svg>