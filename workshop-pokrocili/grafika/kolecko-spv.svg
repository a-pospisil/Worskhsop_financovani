 marker-end="url(#ahc)"/><circle cx="877.0" cy="437.2" r="22" fill="#B6DCCB" stroke="#06231C" stroke-width="4"/><text x="877.0" y="446.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" fill="#06231C" font-weight="bold" text-anchor="middle">5</text><line x1="1120" y1="600" x2="846" y2="350" stroke="#D9BE7F" stroke-width="5" marker-end="url(#ah)"/><circle cx="928.2" cy="425.0" r="22" fill="#D9BE7F" stroke="#06231C" stroke-width="4"/><text x="928.2" y="434.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" fill="#06231C" font-weight="bold" text-anchor="middle">6</text><line x1="90" y1="770" x2="150" y2="770" stroke="#D9BE7F" stroke-width="5"/><text x="162" y="777" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#FFFFFF" font-weight="normal" text-anchor="start">peníze</text><line x1="260" y1="770" x2="320" y2="770" stroke="#B6DCCB" stroke-width="5"/><text x="332" y="777" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#FFFFFF" font-weight="normal" text-anchor="start">smluvní vztah (ručení, nájem, podnájem)</text><line x1="760" y1="770" x2="820" y2="770" stroke="#238A6C" stroke-width="5"/><text x="832" y="777" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#FFFFFF" font-weight="normal" text-anchor="start">nemovitost</text><rect x="1330" y="240" width="500" height="550" rx="16" fill="#0A2E24" stroke="#E0951A" stroke-width="3"/><text x="1362" y="292" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#E0951A" font-weight="bold" text-anchor="start" letter-spacing="2">PROČ SPV, A NE PŮVODNÍ S.R.O.</text><text x="1362" y="340.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" fill="#FFFFFF" font-weight="bold" text-anchor="start">Zápůjčka FO je v rozvaze firmy</text><text x="1362" y="372.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" fill="#FFFFFF" font-weight="bold" text-anchor="start">pohledávka za společníky.</text><text x="1362" y="416.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#FFFFFF" font-weight="normal" text-anchor="start">ČSOB i další banky ji FO přičtou</text><text x="1362" y="444.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#FFFFFF" font-weight="normal" text-anchor="start">do splátek → horší DSTI a DTI</text><text x="1362" y="473.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#FFFFFF" font-weight="normal" text-anchor="start">u hypoték na FO.</text><text x="1362" y="516.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#B3BDB9" font-weight="normal" text-anchor="start">„Jiné pohledávky“ banky čím dál</text><text x="1362" y="544.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#B3BDB9" font-weight="normal" text-anchor="start">častěji rozklíčují.</text><line x1="1362" y1="570" x2="1798" y2="570" stroke="#12453A" stroke-width="2"/><text x="1362" y="612" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" fill="#D9BE7F" font-weight="bold" text-anchor="start">V SPV zůstává úvěr i zápůjčka.</text><text x="1362" y="650.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#FFFFFF" font-weight="normal" text-anchor="start">Původní s.r.o. jen ručí / přistupuje</text><text x="1362" y="678.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#FFFFFF" font-weight="normal" text-anchor="start">k závazku – její výkazy nenesou</text><text x="1362" y="707.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#FFFFFF" font-weight="normal" text-anchor="start">zápůjčku společníkovi.</text><text x="1362" y="740.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#B6DCCB" font-weight="normal" text-anchor="start">Podmínka Monety: obrat SPV ≥ 2× splátka</text><text x="1362" y="768.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#B6DCCB" font-weight="normal" text-anchor="start">od třetích osob → řeší krok 6.</text><rect x="90" y="810" width="425" height="96" rx="12" fill="#0A2E24" stroke="#12453A" stroke-width="2"/><circle cx="124" cy="846" r="20" fill="#D9BE7F"/><text x="124" y="854" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#06231C" font-weight="bold" text-anchor="middle">1</text><text x="156" y="852" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#FFFFFF" font-weight="bold" text-anchor="start">Moneta půjčí SPV</text><text x="156" y="884" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#B3BDB9" font-weight="normal" text-anchor="start">zástava = nemovitost FO · R = ručení s.r.o.</text><rect x="528" y="810" width="425" height="96" rx="12" fill="#0A2E24" stroke="#12453A" stroke-width="2"/><circle cx="562" cy="846" r="20" fill="#D9BE7F"/><text x="562" y="854" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#06231C" font-weight="bold" text-anchor="middle">2</text><text x="594" y="852" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#FFFFFF" font-weight="bold" text-anchor="start">SPV půjčí FO</text><text x="594" y="884" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#B3BDB9" font-weight="normal" text-anchor="start">zápůjčka vždy za tržní úrok</text><rect x="966" y="810" width="425" height="96" rx="12" fill="#0A2E24" stroke="#12453A" stroke-width="2"/><circle cx="1000" cy="846" r="20" fill="#D9BE7F"/><text x="1000" y="854" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#06231C" font-weight="bold" text-anchor="middle">3</text><text x="1032" y="852" font-family="Liberation Sans, Arial, H